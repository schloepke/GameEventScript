name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer revision supersedes older verification of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify CI change selection
        run: python3 scripts/test-ci-swift-scope.py
      - name: Select Swift verification scope
        id: scope
        run: python3 scripts/ci-swift-scope.py

  # The packages declare swift-tools-version 6.0, so the libraries consumers build must compile with it.
  linux-minimum:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1@sha256:42b58c8cff07f45e6f083ade65743b5b147d0c01d4370d602fcf3c7b37dc1cac
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the standalone Syntax module on Linux
        run: swift test --package-path implementation/swift/GameEventScriptSyntax --scratch-path artifacts/swift/syntax --disable-build-manifest-caching --configuration release
      - name: Build the libraries with the minimum toolchain
        run: |
          for package in GameEventScriptRuntime GameEventScriptCompiler GameEventScriptGenerator GameEventScriptNetwork GameEventScriptNetworkSockets; do
            swift build --package-path "implementation/swift/$package" --scratch-path "artifacts/swift/minimum/$package" --disable-build-manifest-caching
          done

  # The static Linux CLI is built with this toolchain and image, so the corpus and the CLI checks run on it too.
  linux:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: swift:6.4.0-jammy@sha256:a6053d2de72091906bfa064f76f145e3f28830664cae250e1b84aa8c499a8ee6
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the Swift port, the shared corpus and the CLI on Linux
        run: ./scripts/test-swift-linux.sh
      # The Wasm SDK matches this image's toolchain; the card game example pins the same bundle.
      - name: Build the public libraries for WebAssembly (WASI)
        run: |
          swift sdk install https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          python3 scripts/build-swift-wasm.py --swift swift --sdk swift-6.4.0-RELEASE_wasm
      # The Android SDK matches this image's toolchain and links the pinned LTS NDK r30.
      - name: Build the public libraries for Android
        run: |
          apt-get update -qq && apt-get install -y -qq unzip > /dev/null
          swift sdk install https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz \
            --checksum 21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r30-linux.zip
          echo "5107f898313790e449e87eee2183d9a20602dee9  $RUNNER_TEMP/ndk.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          ANDROID_NDK_HOME="$RUNNER_TEMP/android-ndk-r30" python3 scripts/build-swift-android.py --swift swift --sdk swift-6.4.0-RELEASE_android

  distribution:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately fresh: tagged consumers must prove clean package consumption.
      - name: Verify the public SwiftPM distribution and shared root tests
        run: python3 scripts/test-swift-package.py

  native-packages:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    # Debug package and CLI tests, the cross-port checks of both CLIs and the API gate; about 30 minutes.
    timeout-minutes: 50
    steps:
      - if: needs.changes.outputs.swift == 'true'
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.swift == 'true'
        name: Verify repository cleanup safety
        run: python3 scripts/test-clean.py

      - if: needs.changes.outputs.swift == 'true'
        name: Install reference compiler SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.404

      - if: needs.changes.outputs.swift == 'true'
        name: Record Swift toolchain
        id: toolchain
        run: |
          swift --version
          identity=$( { swift --version; xcodebuild -version; xcrun --show-sdk-path; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Cache stable local package builds, never test reports or the isolated
      # tagged-consumer scratch directories. Every check still executes.
      - if: needs.changes.outputs.swift == 'true'
        name: Restore incremental Swift builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            artifacts/swift/syntax
            artifacts/swift/swiftbridge
            artifacts/swift/generator
            artifacts/swift/network
            artifacts/swift/networksockets
            artifacts/swift/tool
          key: swift-build-v4-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-${{ github.sha }}
          restore-keys: |
            swift-build-v4-packages-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift declaration spacing controls
        run: python3 scripts/test-swift-spacing.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift formatting
        run: ./scripts/format-swift.sh

      - if: needs.changes.outputs.swift == 'true'
        name: Verify license headers outside the C# license test
        run: |
          python3 scripts/verify-license-headers.py --self-test
          python3 scripts/verify-license-headers.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify direct Swift target dependencies
        run: python3 scripts/verify-swift-dependencies.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Foundation-free portable Swift libraries
        run: |
          python3 scripts/test-swift-portable-imports.py
          python3 scripts/verify-swift-portable-imports.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify temporary workspace cleanup
        run: python3 scripts/test-verification-workspace.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify incremental Swift source discovery
        run: python3 scripts/test-swift-incremental.py

      - if: needs.changes.outputs.swift == 'true'
        name: Build packages and run the cross-port checks of both CLIs
        run: ./scripts/test-swift.sh packages

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift documentation gate controls
        run: python3 scripts/test-swift-api.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift API surface and documentation
        run: python3 scripts/verify-swift-api.py --reuse-local-builds

  native-conformance:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    # The Release Conformance adapter, the shared corpus and the adapter-based cross-port checks; about 25 minutes.
    timeout-minutes: 50
    steps:
      - if: needs.changes.outputs.swift == 'true'
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.swift == 'true'
        name: Install reference compiler SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.404

      - if: needs.changes.outputs.swift == 'true'
        name: Record Swift toolchain
        id: toolchain
        run: |
          swift --version
          identity=$( { swift --version; xcodebuild -version; xcrun --show-sdk-path; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Cache stable local package builds, never test reports or the isolated
      # tagged-consumer scratch directories. Every check still executes.
      - if: needs.changes.outputs.swift == 'true'
        name: Restore incremental Swift builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            artifacts/swift/conformance
            artifacts/swift/tool
          key: swift-build-v4-conformance-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-${{ github.sha }}
          restore-keys: |
            swift-build-v4-conformance-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-

      - if: needs.changes.outputs.swift == 'true'
        name: Build the Conformance adapter and verify shared conformance
        id: conformance
        run: ./scripts/test-swift.sh conformance

      - if: needs.changes.outputs.swift == 'true'
        name: Verify the Swift guide examples
        run: python3 scripts/test-guide-examples.py --language swift

      - name: Upload conformance and runtime interoperability results
        if: ${{ always() && needs.changes.outputs.swift == 'true' && (steps.conformance.outcome == 'success' || hashFiles('artifacts/swift/conformance-results/**', 'artifacts/swift/number-text-roundtrip/**', 'artifacts/swift/message-json-roundtrip/**', 'artifacts/swift/document-roundtrip/**', 'artifacts/swift/binary-reader-fuzz/**', 'artifacts/swift/binary-roundtrip-properties/**') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-conformance
          path: |
            artifacts/swift/conformance-results/
            artifacts/swift/number-text-roundtrip/
            artifacts/swift/message-json-roundtrip/
            artifacts/swift/document-roundtrip/
            artifacts/swift/binary-reader-fuzz/
            artifacts/swift/binary-roundtrip-properties/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [changes, native-packages, native-conformance, distribution, linux-minimum, linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify result gate controls
        run: python3 scripts/test-ci-swift-result.py
      - name: Require all selected Swift checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_SWIFT: ${{ needs.changes.outputs.swift }}
          PACKAGES_RESULT: ${{ needs.native-packages.result }}
          CONFORMANCE_RESULT: ${{ needs.native-conformance.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          MINIMUM_RESULT: ${{ needs.linux-minimum.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: python3 scripts/ci-swift-result.py
