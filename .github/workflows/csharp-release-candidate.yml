name: C# Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to prepare
        required: true
        default: 0.1.0-rc.1
        type: string
      publish:
        description: Publish after environment approval (disabled by default)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned .NET SDK and test runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.201

      - name: Restore and test
        run: |
          dotnet restore GameEventScript.sln
          dotnet test implementation/csharp/tests/GameEventScript.Tests/GameEventScript.Tests.csproj --configuration Release --no-restore --filter "TestCategory!=Performance"

      - name: Prepare release candidate without publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/release-csharp-dry-run.sh "$RELEASE_VERSION"

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-release-${{ inputs.version }}
          path: |
            artifacts/csharp/dll/${{ inputs.version }}/
            artifacts/csharp/packages/*${{ inputs.version }}.*nupkg
          if-no-files-found: error
          retention-days: 30

  publish-nuget:
    if: ${{ inputs.publish && vars.NUGET_PUBLISH_ENABLED == 'true' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201

      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: csharp-release-${{ inputs.version }}
          path: release-candidate

      - name: Acquire short-lived NuGet API key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        run: dotnet nuget push "release-candidate/packages/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
