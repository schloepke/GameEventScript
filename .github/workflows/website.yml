name: Website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main builds/publications; PRs have independent groups. The publisher
# also rejects stale main revisions, including manually rerun historical jobs.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  csharp-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201
      - name: Generate public C# API with DocFX
        run: python3 scripts/build-api-docs.py --language csharp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-api-csharp
          path: artifacts/website/api/csharp/
          if-no-files-found: error
          retention-days: 7

  swift-api:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate public Swift API with DocC
        run: python3 scripts/build-api-docs.py --language swift
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website-api-swift
          path: artifacts/website/api/swift/
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [csharp-api, swift-api]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify publication with local test repositories
        run: python3 scripts/test-publish-website.py

      - name: Verify static asset filtering and deployment checks
        run: python3 scripts/test-website-assets.py

      - name: Install website build tools
        working-directory: website
        run: npm ci --no-fund --no-audit

      - name: Download C# API from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-api-csharp
          path: artifacts/website/api/csharp/
      - name: Download Swift API from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website-api-swift
          path: artifacts/website/api/swift/
      - name: Verify API staging controls
        run: python3 scripts/test-api-docs.py

      - name: Build website and verify links
        working-directory: website
        run: npm run build

      - name: Upload verified static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: website
          path: artifacts/website/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out publication script and configure Git authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download this run's verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: website
          path: artifacts/website/dist/

      - name: Publish to the site branch
        env:
          WEBSITE_SOURCE: ${{ github.sha }}
        run: python3 scripts/publish-website.py --source "$WEBSITE_SOURCE"
