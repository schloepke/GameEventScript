name: C# Performance Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: [self-hosted, macOS, ARM64, ges-performance]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned .NET SDK and test runtime
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201

      - name: Run profile-matched performance tests
        run: ./scripts/test-csharp-performance.sh

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csharp-performance-reports
          path: artifacts/conformance/
          if-no-files-found: warn
          retention-days: 30
