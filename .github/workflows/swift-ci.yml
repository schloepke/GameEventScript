name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository cleanup safety
        run: python3 scripts/test-clean.py

      - name: Install reference compiler SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201

      - name: Record Swift toolchain
        run: swift --version

      - name: Verify Swift declaration spacing controls
        run: python3 scripts/test-swift-spacing.py

      - name: Verify Swift formatting
        run: ./scripts/format-swift.sh

      - name: Verify direct Swift target dependencies
        run: python3 scripts/verify-swift-dependencies.py

      - name: Verify incremental Swift source discovery
        run: python3 scripts/test-swift-incremental.py

      - name: Verify the public SwiftPM distribution
        run: python3 scripts/test-swift-package.py

      - name: Build packages and verify shared conformance
        id: conformance
        run: ./scripts/test-swift.sh

      - name: Verify Swift documentation gate controls
        run: python3 scripts/test-swift-api.py

      - name: Verify Swift API surface and documentation
        run: python3 scripts/verify-swift-api.py

      - name: Upload full and compact conformance results
        if: ${{ always() && (steps.conformance.outcome == 'success' || hashFiles('artifacts/swift/conformance-results/**', 'artifacts/swift/number-text-roundtrip/**', 'artifacts/swift/message-json-roundtrip/**') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-conformance
          path: |
            artifacts/swift/conformance-results/
            artifacts/swift/number-text-roundtrip/
            artifacts/swift/message-json-roundtrip/
          if-no-files-found: error
          retention-days: 14
