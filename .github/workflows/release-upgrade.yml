name: Release Upgrade Validation

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { language: csharp, runner: ubuntu-latest }
          - { language: swift, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Verify upgrade harness controls
        run: python3 scripts/test-release-upgrade-controls.py
      - name: Upgrade real consumers from the pinned release
        run: python3 scripts/test-release-upgrade.py --language '${{ matrix.language }}'
      - name: Retain upgrade evidence and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-upgrade-${{ matrix.language }}
          path: artifacts/release-upgrade/${{ matrix.language }}/**/*.log
          if-no-files-found: warn
          retention-days: 30
