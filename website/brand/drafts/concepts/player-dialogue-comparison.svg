<text x="24" y="180" font-size="12" letter-spacing="1.5" fill="#63728a">03 / PIXEL-BUDDIES</text>
<use href="#pixel-buddies-color" transform="translate(84 204) scale(3)"/>
<text x="180" y="423" text-anchor="middle" font-size="22" font-weight="750" letter-spacing="-.5">Game Event Script</text>
<text x="180" y="453" text-anchor="middle" font-size="13" fill="#63728a">Kleine Pupillen schaffen Blickkontakt.</text>
<text x="180" y="474" text-anchor="middle" font-size="13" fill="#63728a">Der untere Spieler schaut nach oben.</text>
