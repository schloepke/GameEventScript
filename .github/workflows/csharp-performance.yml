name: C# Performance Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: [self-hosted, macOS, ARM64, ges-performance]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned .NET SDK and test runtime
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.201

      - name: Run profile-matched performance tests
        run: ./scripts/test-csharp-performance.sh

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: csharp-performance-reports
          path: artifacts/conformance/
          if-no-files-found: warn
          retention-days: 30
