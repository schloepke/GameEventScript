<text x="36" y="42" font-size="12" letter-spacing="2" fill="#65728a">GAME EVENT SCRIPT / DIALOG + PLAY</text>
<text x="36" y="89" font-size="35" font-weight="750" letter-spacing="-.8">Der Dialog bekommt Spielcharakter.</text>
<text x="36" y="121" font-size="15" fill="#65728a">Die gemeinsame Bewegung bleibt. Pixel und kleine Charaktere bringen zwei neue Nuancen hinein.</text>
