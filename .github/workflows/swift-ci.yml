name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer revision supersedes older verification of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify CI change selection
        run: python3 scripts/test-ci-swift-scope.py
      - name: Select Swift verification scope
        id: scope
        run: python3 scripts/ci-swift-scope.py

  highlighter-linux:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify standalone Foundation highlighting on Linux
        run: swift test --package-path implementation/swift/GameEventScriptSyntaxHighlighter --scratch-path artifacts/swift/syntaxhighlighter --disable-build-manifest-caching --configuration release

  distribution:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Deliberately fresh: tagged consumers must prove clean package consumption.
      - name: Verify the public SwiftPM distribution and shared root tests
        run: python3 scripts/test-swift-package.py

  native:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.swift == 'true'
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: needs.changes.outputs.swift == 'true'
        name: Verify repository cleanup safety
        run: python3 scripts/test-clean.py

      - if: needs.changes.outputs.swift == 'true'
        name: Install reference compiler SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.201

      - if: needs.changes.outputs.swift == 'true'
        name: Record Swift toolchain
        id: toolchain
        run: |
          swift --version
          identity=$( { swift --version; xcodebuild -version; xcrun --show-sdk-path; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # Cache stable local package builds, never test reports or the isolated
      # tagged-consumer scratch directories. Every check still executes.
      - if: needs.changes.outputs.swift == 'true'
        name: Restore incremental Swift builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            artifacts/swift/swiftbridge
            artifacts/swift/conformance
            artifacts/swift/tool
            artifacts/swift/syntaxhighlighter
          key: swift-build-v3-default-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-${{ github.sha }}
          restore-keys: |
            swift-build-v3-default-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Package.swift', 'implementation/swift/**/Package.swift', 'implementation/swift/**/Package.resolved', 'scripts/test-swift*.sh', 'scripts/verify-swift-api.py') }}-

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift declaration spacing controls
        run: python3 scripts/test-swift-spacing.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift formatting
        run: ./scripts/format-swift.sh

      - if: needs.changes.outputs.swift == 'true'
        name: Verify direct Swift target dependencies
        run: python3 scripts/verify-swift-dependencies.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify temporary workspace cleanup
        run: python3 scripts/test-verification-workspace.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify incremental Swift source discovery
        run: python3 scripts/test-swift-incremental.py

      - if: needs.changes.outputs.swift == 'true'
        name: Build packages and verify shared conformance
        id: conformance
        run: ./scripts/test-swift.sh

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift documentation gate controls
        run: python3 scripts/test-swift-api.py

      - if: needs.changes.outputs.swift == 'true'
        name: Verify Swift API surface and documentation
        run: python3 scripts/verify-swift-api.py --reuse-local-builds

      - name: Upload full and compact conformance results
        if: ${{ always() && needs.changes.outputs.swift == 'true' && (steps.conformance.outcome == 'success' || hashFiles('artifacts/swift/conformance-results/**', 'artifacts/swift/number-text-roundtrip/**', 'artifacts/swift/message-json-roundtrip/**') != '') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-conformance
          path: |
            artifacts/swift/conformance-results/
            artifacts/swift/number-text-roundtrip/
            artifacts/swift/message-json-roundtrip/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [changes, native, distribution, highlighter-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify result gate controls
        run: python3 scripts/test-ci-swift-result.py
      - name: Require all selected Swift checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUN_SWIFT: ${{ needs.changes.outputs.swift }}
          NATIVE_RESULT: ${{ needs.native.result }}
          DISTRIBUTION_RESULT: ${{ needs.distribution.result }}
          HIGHLIGHTER_RESULT: ${{ needs.highlighter-linux.result }}
        run: python3 scripts/ci-swift-result.py
