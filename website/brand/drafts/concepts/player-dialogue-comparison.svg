<text x="180" y="423" text-anchor="middle" font-size="22" font-weight="750" letter-spacing="-.5">Game Event Script</text>
<text x="180" y="453" text-anchor="middle" font-size="13" fill="#63728a">Augen weiter vorn.</text>
<text x="180" y="474" text-anchor="middle" font-size="13" fill="#63728a">Beide Gesichter bewusst gesetzt.</text>
