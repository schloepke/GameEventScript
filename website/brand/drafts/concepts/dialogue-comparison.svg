<text x="40" y="91" font-size="36" font-weight="750" letter-spacing="-1">Ein Dialog, der Bewegung erzeugt.</text>
<text x="40" y="123" font-size="16" fill="#65728a">Weiche Konturen, wechselnde Rollen und ein gemeinsamer Raum dazwischen.</text>
