<g font-family="system-ui, sans-serif" fill="#10203c">
<text x="36" y="40" font-size="12" letter-spacing="2" fill="#63728a">GAME EVENT SCRIPT / PIXEL-DIALOG</text>
<text x="36" y="84" font-size="34" font-weight="750" letter-spacing="-.8">Zwei Spieler. Ein gemeinsamer Auftritt.</text>
<text x="36" y="115" font-size="15" fill="#63728a">Blau und Türkis unterscheiden die Stimmen; die Augen sitzen näher an der sprechenden Seite.</text>
<g transform="translate(36 0)">
<rect y="144" width="360" height="505" rx="24" fill="white"/>
<text x="24" y="180" font-size="12" letter-spacing="1.5" fill="#63728a">01 / PIXEL-DUO</text>
<use href="#pixel-duo-color" transform="translate(84 204) scale(3)"/>
<text x="180" y="423" text-anchor="middle" font-size="22" font-weight="750" letter-spacing="-.5">Game Event Script</text>
<text x="180" y="453" text-anchor="middle" font-size="13" fill="#63728a">Die vertraute Silhouette.</text>
<text x="180" y="474" text-anchor="middle" font-size="13" fill="#63728a">Jetzt mit zwei Spielerfarben.</text>
<path d="M24 498H336" stroke="#edf0f5"/>
<rect x="24" y="523" width="72" height="72" rx="16" fill="#10203c"/>
<use href="#pixel-duo-color" transform="translate(28 527)"/>
<use href="#pixel-duo-mono" transform="translate(123 539) scale(.625)" color="#10203c"/>
<use href="#pixel-duo-color" transform="translate(193 543) scale(.5)"/>
<use href="#pixel-duo-color" transform="translate(251 547) scale(.375)"/>
<use href="#pixel-duo-mono" transform="translate(307 551) scale(.25)" color="#10203c"/>
<g font-size="10" fill="#63728a" text-anchor="middle"><text x="60" y="619">Dunkel</text><text x="143" y="619">Einfarbig</text><text x="209" y="619">32 px</text><text x="263" y="619">24 px</text><text x="315" y="619">16 px</text></g></g><g transform="translate(418 0)">
<rect y="144" width="360" height="505" rx="24" fill="white"/>
<text x="24" y="180" font-size="12" letter-spacing="1.5" fill="#63728a">02 / BLICKKONTAKT</text>
